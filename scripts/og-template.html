<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Mona Sans"; src: url("../public/fonts/MonaSans-latin.woff2") format("woff2"); font-weight: 200 900; font-stretch: 75% 125%; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Mona Sans", sans-serif; color: #f2efe9; background: #0c0c0e; position: relative; -webkit-font-smoothing: antialiased; }
  .copy { position: absolute; left: 72px; top: 72px; width: 640px; }
  .name { font-size: 20px; font-weight: 560; letter-spacing: -0.01em; }
  .name span { color: #8a857d; font-weight: 400; margin-left: 10px; }
  h1 { font-size: 64px; font-weight: 560; font-stretch: 98%; line-height: 1.02; letter-spacing: -0.03em; margin: 150px 0 0; }
  h1 .key { background: linear-gradient(#ff4a1c, #ff4a1c) no-repeat 0 94% / 100% 0.06em; }
  .line { position: absolute; left: 72px; bottom: 64px; font-size: 18px; color: #8a857d; }
  .still { position: absolute; right: 72px; top: 72px; width: 324px; height: 486px; border-radius: 6px; overflow: hidden; background: #000; }
  .still img { width: 100%; height: 100%; object-fit: cover; }
  .cap { position: absolute; right: 72px; bottom: 64px; width: 324px; font-size: 11px; font-weight: 540; letter-spacing: 0.08em; text-transform: uppercase; color: #8a857d; }
</style>
</head>
<body>
  <div class="copy">
    <div class="name">Saahil Mehta <span>Associate Director, Data &amp; Insights</span></div>
    <h1>I lead data and AI at South Pole, and I <span class="key">still ship the systems myself</span>.</h1>
  </div>
  <div class="line">saahil.co.uk</div>
  <div class="still"><img src="../public/portrait-still.webp" alt="" /></div>
  <div class="cap">Saahil Mehta, South Pole, 2026</div>
</body>
</html>
