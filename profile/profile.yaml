    site_detail: >-
      Owners and stewards are defined once in the semantic layer and reused by access
      approvals, quality routing and AI context, which is what makes the seven workstreams
      one ecosystem rather than a list of tools. Each era has exit criteria; SLAs come last,
      by design, because service levels without coverage and ownership instrumentation are
      fiction.

  - name: Data Access Governance
    org: South Pole
    venue: South Pole · Production
    period: "2026"
    status: live
    category: Governance
    mark: keyhole
    since: "2026-10"
    until: null
    metric: {value: "40+ h", label: "returned to the team each month"}
    tags: [IAM, Terraform, GitHub App, Governance]
    icon: assets/system-regular-63-settings-cog-hover-cog-1.json
    link: null
    cv_line: "Self-service access portal that opens Terraform IAM grant pull requests through a GitHub App; 40+ hours a month returned to the team."
    site_summary: >-
      Self-service data access. A request names the access group and the reason, mails the
      data owner, and opens a Terraform pull request that grants the group read access,
      through an org-owned GitHub App. A human still merges. Replaced hand-edited IAM at
      around ten changes a month and returned 40+ hours a month to the team.
    site_detail: >-
      Access is granted to groups, never to people. The server re-resolves memberships, so a
      mail can only claim what the server established. Terraform preconditions fail the plan
      on an unknown dataset or an overlapping binding, so machine-written grants cannot
      silently revoke hand-written ones. My design, built by an engineer on my team.

