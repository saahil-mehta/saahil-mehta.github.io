    orca:
      line: "South Pole's enterprise AI assistant. I designed and built it, and it opened to the whole company in June 2026."
      demo:
        note: "A reconstruction of the Orca interface. The accounts and figures are invented."
        question: "Which accounts with a 2030 net-zero target retired fewer credits this year than last? Turn it into a deck for Monday."
        steps:
          - "Read the certified definition of a retirement"
          - "Queried the marts as you, three tables"
          - "Matched targets to retirements by account"
          - "Built a six-slide deck from the company template"
