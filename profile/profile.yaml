    mark: chevron
    since: "2026-09"
    until: null
    metric: {value: "1,800+", label: "dbt models orchestrated"}
    tags: [Dagster, dbt, GKE, Cloud Build]
    icon: assets/system-regular-22-build-hover-build.json
    link: null
    cv_line: "Orchestration for 1,800+ dbt models migrated from dbt Cloud to self-hosted Dagster on GKE in three weeks, avoiding a three-year lock-in quoted at over 50k EUR a year."
    site_summary: >-
      Orchestration for 1,800+ dbt models, migrated from dbt Cloud to self-hosted Dagster
      on GKE in three weeks. Shadow runs proved the output identical to production before
      cutover; deploys rebuild the image and roll out without a human step. Avoided a
      three-year lock-in quoted at over 50k EUR a year.
    site_detail: >-
      Dagster mirrors each dbt Cloud job verbatim (selectors, threads, schedules), so any
      difference is the runner's fault. Evidence compares every relation between shadow
      and production. Cloud Build rebuilds the image on merge, changed models build on every
      marts merge, and alerting is episodic (state changes plus a daily summary) with data
      and infrastructure alerts split. The UI sits behind Identity-Aware Proxy.

