        - {name: Memory, line: "Shared chats and artefacts, personal memory and instructions."}
      adoption:
        - "Since the first release on 11 June, 335 people have signed up and 272 have asked a question. 188 used Orca in the last 30 days."
        - "It has run 15,227 governed queries as the person asking and produced 1,648 artefacts, 247 of them exported to Docs, Sheets and Slides."
        - "A release ships about once a month, each gated by an answer-quality evaluation. Release 2.0 carried more than 150 improvements."
      lean:
        - "Orca runs in a Google Cloud region on 79% carbon-free energy."
        - "Two thirds of what it read in October came from cache, which has saved about 4,600 EUR on model input since June."
        - "Every query is cost-checked before it runs. The typical one reads about 19 MB."
        - "It scales to 30 instances under load and back to one when the load passes."
        - "Offering Orca to every employee costs about 12 EUR a person a month, hosting and models together."
        - "Its hosting emitted about 1.5 kg CO₂e in September, roughly a 9 km drive in a petrol car."
    platform:
      line: "The governed data platform every team and Orca read from. My team and I rebuilt it from 2023 to 2026 while it stayed in daily use."
      eras:
        - {year: "2023", name: Inherited, line: "Infrastructure changed by hand, half of pipeline changes skipped review, and nothing tracked whether runs succeeded."}
        - {year: "2024", name: Stabilised, line: "We wrote the standards for marts, pull requests and review, and repaired the failing runs."}
        - {year: "2025", name: Codified, line: "The core of the estate moved into Terraform in about four months, secrets were encrypted in code, and review became the default."}
        - {year: "2026", name: Governed, line: "Sensitive columns are masked at source, Dagster runs the marts, and the Orca family runs on the platform."}
