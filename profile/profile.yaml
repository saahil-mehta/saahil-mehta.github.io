summaries:
  cv: >-
    Associate Director leading a six-person data and insights team at South Pole, a
    501-person climate solutions company. Built Orca, the company's enterprise AI
    assistant, and the governed platform underneath it: a semantic layer on
    OpenMetadata, self-hosted Dagster orchestration, automated access governance and
    FinOps across 195 GCP projects. Author of the data strategy adopted by ExCo, with
    ~150k EUR a year banked or avoided in its plan. Hands-on across GCP, BigQuery,
    Terraform, dbt, Dagster, FastAPI and LLM systems.
  site_bio: |-
    I build data platforms that are reliable by design. The best infrastructure is the kind you don't notice. It works quietly and scales without surprises.

    I'm Associate Director, Data & Insights at [South Pole](https://www.southpole.com), where I lead a team of six and own the data platform, the data marts and the reporting stack for a company of 500. Most of my time goes into Orca, the enterprise AI assistant I built for the business, and the governed platform underneath it: a semantic layer that tells Orca what our data means, self-hosted orchestration, access governance that runs itself, and cost monitoring across every GCP project we have.

    Based in Reading. I mentor early-career data people through the Data Science Festival and volunteer at the Museum of English Rural Life (MERL), where I built an OCR + two-stage LLM pipeline that turned nine years of handwritten visitor cards into searchable data and a report for the leadership team.

    Weekends involve cars (especially routes like Hardknott Pass), PC building, and reading the Gita and the Stoics. I also have a tendency to hoard cables 'just in case' (recovering, slowly).

    If you want to talk about building AI systems people actually use, leading data teams, cars, motorcycles, or optimising your data/infra/cloud, I'm around.
  linkedin: |-
    I lead Data & Insights at South Pole: a team of six running the data platform, data marts and reporting for 501 people, and the data strategy behind them.

    In 2026 I built Orca, South Pole's enterprise AI assistant. It researches, writes South Pole-format documents, decks and proposals, and answers questions from governed company data, with each person seeing only what their role allows. Within three weeks of the 2.0 release, over a quarter of the company was querying data through it.

    Underneath Orca sits the platform my team and I run: a semantic layer on OpenMetadata that records what our data means and who owns it, self-hosted Dagster orchestration (migrated from dbt Cloud in three weeks), automated access governance, and cost monitoring with anomaly alerting across 195 GCP projects. The Data Foundation Plan I wrote, seven workstreams to 2028, was adopted by ExCo with ~150k EUR a year of costs banked or avoided.

    Before South Pole: data engineering at Publicis Groupe (Digitas UK and Mumbai) and WPP for brands including Samsung, Formula 1 and Disney+ Hotstar.

    I mentor through the Data Science Festival and volunteer at the Museum of English Rural Life. Happy to talk about enterprise AI, data platforms, or leading data teams.

