projects:
  - name: Orca
    org: South Pole
    venue: South Pole · Production
    period: 2026 - Present
    status: live
    category: AI assistant
    mark: ring
    since: "2026-06"
    until: null
    metric: {value: "560,000+", label: "requests at 99.99% success"}
    tags: [Enterprise AI, Deep Research, RAG, Cloud Run, IAM]
    icon: assets/system-regular-1-share-hover-pinch.json
    link: null
    cv_line: "Enterprise AI assistant for 501 employees: deep research over company data, South Pole-format documents, decks and proposals, position-aware access; 560,000+ requests at 99.99% success."
    site_summary: >-
      South Pole's enterprise AI assistant, open to the whole company. Deep research over
      the web and company data, South Pole-format documents, decks and sales proposals,
      scheduled runs, memory, and sharing with version history. Eight releases in four
      months. Within three weeks of 2.0, 131 employees were querying governed data through
      it; 560,000+ requests served at 99.99% success.
    site_detail: >-
      Next.js on Cloud Run behind Identity-Aware Proxy, Cloud SQL for state. Every BigQuery
      query runs as the signed-in user, so IAM and policy-tag masking decide what each
      person sees; no shared service account touches data, and every job is labelled so
      audit can tell Orca traffic apart. Context comes from the semantic layer over MCP, so
      answers rest on definitions the business certified. Guardrails decline bulk extracts
      of whole tables and personal records; eval suites gate each release.

  - name: Orca Semantics
    org: South Pole
    venue: South Pole · In Build
    period: 2026 - Present
    status: in_progress
    category: Semantic layer
    mark: arch
    since: "2026-07"
    until: null
    metric: {value: "6", label: "domains, owners named"}
    tags: [OpenMetadata, Semantic Layer, Governance, Terraform]
    icon: assets/system-regular-14-article-hover-article.json
    link: null
    cv_line: "Governed semantic layer on self-hosted OpenMetadata: version-controlled definitions, named domain owners, streamed into Orca as context."
    site_summary: >-
      A governed semantic layer on self-hosted OpenMetadata: plain-English definitions,
      certified metric SQL, a glossary and named owners per domain, all version controlled.
      Orca reads it before answering, the visualisation layer builds on it, and access
      approvals and quality routing reuse the same ownership model.
    site_detail: >-
      Chosen over Cube and the dbt Semantic Layer because it is metadata-only: it never
      proxies queries, so per-user identity, IAM and PII masking stay intact. One Terraform
      module deploys dev and prod, Google SSO at the door, read-only ingestion from dbt and
      BigQuery. AI-drafted definitions are seeded in bulk and certified by domain owners in a
      task queue; uncertified drafts are hints, never truth.

