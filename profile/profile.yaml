volunteering:
  - name: MERL Visitor Insight Engine
    venue: Museum of English Rural Life · Volunteer
    year: 2025 - Present
    link: null
    icon: assets/system-regular-14-article-hover-article.json
    tags: [Visual Reasoning, Multimodal LLMs, Contextual Intelligence, Deep Research Agents]
    cv_line: "Volunteer, Museum of English Rural Life (Jun 2025 to present): built an OCR + two-stage LLM pipeline that turned nine years of handwritten visitor cards into searchable data and a leadership report."
    challenge: >-
      Nine years of handwritten visitor feedback sitting in physical comment books. Cursive,
      children's scrawls, notes in Arabic, Mandarin, Turkish, German. References to
      philosophy, politics, internet memes. Material traditional OCR can't read.
    details:
      - title: The Pipeline
        paragraphs:
          - "A two-tiered agentic system. The <strong>Visual Reasoning Engine</strong> processes each scanned page with language-agnostic handwriting recognition and contextual understanding. In one entry, it recognised a string of Chinese characters as Zhang Zai's 11th-century Four Sentences (a Neo-Confucian philosophical text) and reasoned about why a visitor might inscribe this in a museum about English rural life."
          - "The <strong>Deep Research Agent</strong> synthesises thousands of entries and surfaces patterns that manual review would miss: a single viral tweet transforming visitor demographics, political events in Turkey appearing in a Reading guest book around the election, visitors from over 75 countries connecting their own agricultural heritage to English farming history."
      - title: What This Proves
        paragraphs:
          - "The system reads handwritten text and understands the context behind it."
          - "When it encountered Turkish handwriting mentioning \"Kılıçdaroğlu\", it recognised this as a reference to the 2023 presidential election and understood why a visitor expressed political sentiment at that moment. It parsed internet slang like \"L + ratio\" as meme-culture discourse and analysed the social dynamics at play. When a visitor from St Helena (population 4,500, remote South Atlantic) wrote about unexpected connections to home, it grasped the geographic and cultural weight of that moment."
          - "Contextual intelligence, working across languages, cultures, and time periods."
    outcome: >-
      Delivered a strategic analysis to museum leadership covering sentiment trends,
      demographic insights, and visitor journey mapping against the Generic Learning
      Outcomes framework. Work that would have taken months of manual effort, completed in
      days. The museum now has evidence-based insight into nearly a decade of visitor
      experience, unlocked from a previously unreadable archive.

