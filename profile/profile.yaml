    cv_line: "Seven-workstream data strategy to 2028 (semantic layer, orchestration, visualisation, AI platform, data quality, access governance, SLAs), costed at ~150k EUR/yr banked or avoided and adopted by ExCo."
    site_summary: >-
      The company data strategy, written, costed and taken to ExCo: seven workstreams to
      2028 covering the semantic layer, orchestration, visualisation, the AI platform, data
      quality at scale, access governance and SLAs. About 150k EUR a year in costs banked
